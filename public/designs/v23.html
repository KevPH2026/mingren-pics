<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mingren.pics V23</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
body{background:#050505;font-family:'Noto Sans SC',sans-serif;min-height:100vh;overflow-x:hidden;color:#fff}
.page{min-height:100vh;display:flex;flex-direction:column;position:relative}
.holo-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0a0a2e 0%,#1a0033 25%,#0d1b2a 50%,#1a0033 75%,#0a0a2e 100%);pointer-events:none}
.holo-bg::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:conic-gradient(from 0deg at 50% 120%,#ff000011,#ff880011,#ffff0011,#00ff0011,#0088ff11,#8800ff11,#ff000011);animation:holoSpin 10s linear infinite}
@keyframes holoSpin{to{transform:rotate(360deg)}}
.content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;padding:2rem;text-align:center}
.badge{display:inline-block;margin:0 auto 1.5rem;padding:.4rem 1.2rem;background:linear-gradient(90deg,#ff008044,#7928ca44,#00d4ff44);border:1px solid #ffffff15;border-radius:2rem;font-size:.6rem;font-weight:900;letter-spacing:4px;text-transform:uppercase;backdrop-filter:blur(10px)}
.title{font-size:4rem;font-weight:900;line-height:.9;letter-spacing:-3px;background:linear-gradient(90deg,#ff0080,#7928ca,##00d4ff,#7928ca,#ff0080);background-size:200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:holoShift 3s ease infinite}
@keyframes holoShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.sub{font-size:1.2rem;font-weight:900;color:#fff;margin-top:.3rem;letter-spacing:8px;text-transform:uppercase;opacity:.6}
.desc{margin:2rem auto;max-width:280px;font-size:.9rem;color:#8888aa;line-height:1.7}
.desc b{color:#fff;font-size:1.1rem}
.cards{display:flex;gap:1rem;justify-content:center;margin:1.5rem 0;flex-wrap:wrap}
.card{width:70px;height:90px;background:#ffffff06;border:1px solid #ffffff10;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(5px);cursor:pointer;transition:all .3s}
.card:hover{background:#ffffff12;border-color:#7928ca44;transform:translateY(-5px)}
.card-e{font-size:1.5rem;margin-bottom:.3rem}
.card-n{font-size:.55rem;color:#888;font-weight:700;letter-spacing:1px}
.cta{margin-top:2rem;display:inline-block;padding:1.1rem 3rem;background:linear-gradient(90deg,#ff0080,#7928ca,#00d4ff);color:#fff;font-weight:900;font-size:1rem;border:none;border-radius:3rem;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 40px #7928ca33;transition:transform .2s}
.cta:hover{transform:scale(1.05)}
.footer{padding:1.5rem;text-align:center;font-size:.5rem;color:#333;letter-spacing:4px;text-transform:uppercase;font-weight:700;position:relative;z-index:1}
</style>
</head>
<body>
<div class="page">
  <div class="holo-bg"></div>
  <div class="content">
    <div class="badge">⚡ GPT-IMAGE 2.0</div>
    <div class="title">跟名人<br>合个影</div>
    <div class="sub">holographic</div>
    <div class="desc">上传自拍 → 选名人<br><b>AI 3秒生成 · 全息级真实</b></div>
    <div class="cards">
      <div class="card"><div class="card-e">💃</div><div class="card-n">Taylor</div></div>
      <div class="card"><div class="card-e">🚀</div><div class="card-n">Musk</div></div>
      <div class="card"><div class="card-e">⚽</div><div class="card-n">Messi</div></div>
      <div class="card"><div class="card-e">🎤</div><div class="card-n">周杰伦</div></div>
    </div>
    <button class="cta">📸 立即开拍</button>
  </div>
  <div class="footer">mingren.pics — holographic ai photos</div>
</div>
</body>
</html>
