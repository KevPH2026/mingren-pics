<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mingren.pics V20</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
body{background:#0d0d0d;font-family:'Noto Sans SC',sans-serif;min-height:100vh;overflow-x:hidden;color:#fff}
.page{min-height:100vh;display:flex;flex-direction:column;position:relative}
.bg-glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;background:radial-gradient(circle,#ff440022,transparent 70%);pointer-events:none}
.content{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0}
.hero{position:relative;overflow:hidden}
.hero-img-placeholder{width:100%;height:55vh;background:linear-gradient(135deg,#1a0a00,#331a00,#1a0a00);position:relative;display:flex;align-items:center;justify-content:center}
.hero-img-placeholder::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,transparent,transparent 3px,#ff440008 3px,#ff440008 4px)}
.hero-img-placeholder::after{content:'合影效果预览';position:absolute;font-size:1.5rem;color:#ff440044;font-weight:900;letter-spacing:5px}
.flash{position:absolute;top:1.5rem;left:1.5rem;background:#ff4400;color:#fff;padding:.3rem 1rem;font-size:.6rem;font-weight:900;letter-spacing:3px;text-transform:uppercase;z-index:2}
.text-block{padding:2rem;position:relative}
.text-block::before{content:'';position:absolute;top:0;left:2rem;right:2rem;height:1px;background:linear-gradient(90deg,#ff4400,transparent)}
.title{font-size:3rem;font-weight:900;line-height:1;letter-spacing:-1px}
.title .fire{color:#ff4400}
.desc{color:#888;font-size:.85rem;margin:1rem 0;line-height:1.6}
.desc b{color:#ff4400;font-size:1rem}
.row{display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap}
.chip{padding:.4rem .8rem;border:1px solid #333;color:#888;font-size:.7rem;font-weight:700;cursor:pointer;transition:all .2s}
.chip:hover{border-color:#ff4400;color:#ff4400}
.bottom-bar{padding:1.5rem 2rem;display:flex;gap:.8rem;align-items:center}
.cta{flex:1;padding:1.1rem;text-align:center;background:#ff4400;color:#fff;font-weight:900;font-size:1rem;border:none;letter-spacing:2px;cursor:pointer;transition:background .2s}
.cta:hover{background:#ff6622}
.ghost{padding:1.1rem 1.5rem;border:1px solid #333;color:#666;font-size:.8rem;font-weight:700;background:transparent;cursor:pointer}
</style>
</head>
<body>
<div class="page">
  <div class="bg-glow"></div>
  <div class="content">
    <div class="hero">
      <div class="flash">▸ GPT-IMAGE 2.0</div>
      <div class="hero-img-placeholder"></div>
    </div>
    <div class="text-block">
      <div class="title">跟<span class="fire">名人</span><br>合个影</div>
      <div class="desc">上传自拍 · 选名人 · <b>3秒AI出图</b><br>不是PS，比真的还真</div>
      <div class="row">
        <span class="chip">💃 Taylor</span>
        <span class="chip">🚀 Musk</span>
        <span class="chip">⚽ Messi</span>
        <span class="chip">🎤 周杰伦</span>
      </div>
    </div>
    <div class="bottom-bar">
      <button class="cta">📸 立即生成</button>
      <button class="ghost">示例</button>
    </div>
  </div>
</div>
</body>
</html>
