<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mingren.pics - 设计稿预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif;padding:2rem}
h1{text-align:center;font-size:1.5rem;margin-bottom:.5rem;color:rgba(255,255,255,.7)}
.subtitle{text-align:center;font-size:.85rem;color:rgba(255,255,255,.3);margin-bottom:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(375px,1fr));gap:2rem;max-width:1600px;margin:0 auto}
.card{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);background:#111}
.card-header{padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.05)}
.card-header h3{font-size:.85rem;font-weight:600;color:rgba(255,255,255,.6)}
.card-header span{font-size:.7rem;color:rgba(255,255,255,.2)}
.card iframe{width:375px;height:812px;border:none;display:block;margin:0 auto}
</style>
</head>
<body>
<h1>📸 mingren.pics 设计稿预览</h1>
<p class="subtitle">10个版本，点击全屏查看</p>
<div class="grid">
  <div class="card"><div class="card-header"><h3>V1 · Framer</h3><span>大胆渐变</span></div><iframe src="v1.html"></iframe></div>
  <div class="card"><div class="card-header"><h3>V2 · RunwayML</h3><span>电影暗色</span></div><iframe src="v2.html"></iframe></div>
  <div class="card"><div class="card-header"><h3>V3 · ElevenLabs</h3><span>波形深紫</span></div><iframe src="v3.html"></iframe></div>
  <div class="card"><div class="card-header"><h3>V4 · Cursor</h3><span>精致渐变</span></div><iframe src="v4.html"></iframe></div>
  <div class="card"><div class="card-header"><h3>V5 · Linear</h3><span>极简暗紫</span></div><iframe src="v5.html"></iframe></div>
  <div class="card"><div class="card-header"><h3>V6 · Spotify</h3><span>亮绿大胆</span></div><iframe src="v6.html"></iframe></div>
  <div class="card"><div class="card-header"><h3>V7 · Apple</h3><span>白色极简</span></div><iframe src="v7.html"></iframe></div>
  <div class="card"><div class="card-header"><h3>V8 · SpaceX</h3><span>纯黑未来</span></div><iframe src="v8.html"></iframe></div>
  <div class="card"><div class="card-header"><h3>V9 · VoltAgent</h3><span>终端翡翠</span></div><iframe src="v9.html"></iframe></div>
  <div class="card"><div class="card-header"><h3>V10 · xAI</h3><span>极简等宽</span></div><iframe src="v10.html"></iframe></div>
</div>
</body>
</html>
