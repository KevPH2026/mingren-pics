<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mingren.pics V17</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
body{background:linear-gradient(180deg,#1b0a3c,#0d001a);font-family:'Noto Sans SC',sans-serif;min-height:100vh;overflow-x:hidden;color:#fff}
.page{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem;position:relative}
.sun{position:absolute;top:15%;left:50%;transform:translateX(-50%);width:280px;height:140px;background:linear-gradient(180deg,#ff6b9d,#c44dff,#6e2dff);border-radius:280px 280px 0 0;opacity:.7}
.sun::after{content:'';position:absolute;top:100%;left:0;width:100%;height:60px;background:repeating-linear-gradient(0deg,#ff6b9d33 0px,#ff6b9d33 2px,transparent 2px,transparent 8px)}
.grid-floor{position:absolute;bottom:0;left:0;width:100%;height:35%;background:linear-gradient(180deg,#1b0a3c00,#1b0a3c),repeating-linear-gradient(90deg,#c44dff33 0px,#c44dff33 1px,transparent 1px,transparent 40px);transform:perspective(300px) rotateX(45deg);transform-origin:bottom}
.bust{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:4rem;opacity:.15}
.content{position:relative;z-index:2;text-align:center}
.label{font-size:.7rem;letter-spacing:6px;color:#c44dff;text-transform:uppercase;margin-bottom:1rem;font-weight:700}
.title{font-size:3.5rem;font-weight:900;line-height:1;letter-spacing:-2px;text-shadow:0 0 40px #c44dff66}
.title .glow{color:#c44dff;text-shadow:0 0 30px #c44dff,0 0 60px #c44dff55}
.desc{color:#8888aa;font-size:.9rem;margin:1.5rem 0;line-height:1.6}
.desc b{color:#ff6b9d}
.icons{display:flex;gap:1rem;justify-content:center;margin:1.5rem 0;font-size:1.5rem;opacity:.8}
.cta{margin-top:1rem;padding:1rem 3rem;background:linear-gradient(90deg,#c44dff,#ff6b9d);color:#fff;font-weight:900;font-size:1.1rem;border:none;letter-spacing:3px;cursor:pointer;box-shadow:0 0 30px #c44dff44;transition:box-shadow .3s}
.cta:hover{box-shadow:0 0 50px #c44dff88}
.footer{position:absolute;bottom:1.5rem;font-size:.6rem;color:#444;letter-spacing:4px}
</style>
</head>
<body>
<div class="page">
  <div class="sun"></div>
  <div class="grid-floor"></div>
  <div class="bust">🗿</div>
  <div class="content">
    <div class="label">▸ VAPORWAVE AESTHETIC ◂</div>
    <div class="title">跟<span class="glow">名人</span><br>合个影</div>
    <div class="desc">上传自拍 → 选名人 → <b>AI合成</b><br>回到那个充满可能的年代</div>
    <div class="icons">💃 🚀 ⚽ 🎤 🌸 🏀</div>
    <button class="cta">PHOTOSHOOT →</button>
  </div>
  <div class="footer">MINGREN.PICS — AESTHETIC</div>
</div>
</body>
</html>
