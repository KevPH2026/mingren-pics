<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mingren.pics V15</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
body{
  background:#000;
  font-family:'Noto Sans SC',sans-serif;
  min-height:100vh;
  overflow:hidden;
}
.full{
  min-height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  padding:0;
}
.top{
  background:#0f0;
  color:#000;
  padding:.6rem 1.5rem;
  font-weight:900;
  font-size:.7rem;
  letter-spacing:4px;
  text-transform:uppercase;
  display:flex;justify-content:space-between;
}
.hero{
  display:flex;flex-direction:column;justify-content:center;
  padding:2rem 1.5rem;
  position:relative;
}
.title{
  font-size:4.5rem;
  font-weight:900;
  line-height:.9;
  letter-spacing:-3px;
  color:#fff;
}
.title .green{
  background:#0f0;
  color:#000;
  padding:0 .3rem;
  display:inline;
}
.title .blue{
  color:#0af;
}
.tagline{
  margin-top:1.5rem;
  font-size:1.1rem;
  color:#666;
  line-height:1.6;
}
.tagline b{color:#fff}
.cards{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:1px;
  background:#222;
  margin:0 1.5rem;
}
.card{
  background:#000;
  padding:1.2rem;
  text-align:center;
  cursor:pointer;
  transition:background .2s;
}
.card:hover{background:#111}
.card-emoji{font-size:1.8rem;margin-bottom:.3rem}
.card-name{font-size:.65rem;color:#888;font-weight:700;letter-spacing:1px}
.bottom{
  padding:1.5rem;
  display:flex;gap:.8rem;align-items:center;
}
.cta{
  flex:1;
  padding:1.2rem;
  background:#0f0;
  color:#000;
  font-weight:900;
  font-size:1.1rem;
  letter-spacing:2px;
  text-align:center;
  border:none;
  cursor:pointer;
  text-transform:uppercase;
}
.cta2{
  padding:1.2rem 1.5rem;
  background:transparent;
  color:#0f0;
  font-weight:900;
  font-size:.8rem;
  border:2px solid #0f0;
  cursor:pointer;
  letter-spacing:1px;
}
.blink{
  animation:blink 1s steps(1) infinite;
}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>
<div class="full">
  <div class="top">
    <span>mingren.pics</span>
    <span>GPT-IMAGE 2.0</span>
  </div>
  <div class="hero">
    <div class="title">
      跟<span class="green">名人</span><br>
      合个影<span class="blink">_</span>
    </div>
    <div class="tagline">
      上传自拍 · 选名人 · <b>3秒出图</b><br>
      <span style="color:#0f0;font-weight:900">不是PS，是AI。比真的还真。</span>
    </div>
  </div>
  <div class="cards">
    <div class="card"><div class="card-emoji">💃</div><div class="card-name">TAYLOR</div></div>
    <div class="card"><div class="card-emoji">🚀</div><div class="card-name">MUSK</div></div>
    <div class="card"><div class="card-emoji">⚽</div><div class="card-name">MESSI</div></div>
    <div class="card"><div class="card-emoji">🎤</div><div class="card-name">周杰伦</div></div>
    <div class="card"><div class="card-emoji">🌸</div><div class="card-name">BTS</div></div>
    <div class="card"><div class="card-emoji">🎬</div><div class="card-name">龙妈</div></div>
  </div>
  <div class="bottom">
    <button class="cta">📸 立即生成</button>
    <button class="cta2">示例</button>
  </div>
</div>
</body>
</html>
