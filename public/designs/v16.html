<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mingren.pics V16</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
body{background:#f5e6d3;font-family:'Noto Sans SC',sans-serif;min-height:100vh;overflow-x:hidden}
.page{min-height:100vh;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem}
.dots{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle,#111 1px,transparent 1px);background-size:8px 8px;opacity:.15;pointer-events:none}
.comic-box{background:#fff;border:4px solid #000;border-radius:12px;padding:2rem;text-align:center;max-width:360px;width:100%;position:relative;box-shadow:6px 6px 0 #000}
.speech{position:absolute;top:-25px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #000;border-radius:20px;padding:.4rem 1.2rem;font-size:.7rem;font-weight:900;white-space:nowrap}
.speech::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#000}
.pow{font-size:5rem;font-weight:900;color:#e00;-webkit-text-stroke:3px #000;font-style:italic;transform:rotate(-5deg);line-height:1;letter-spacing:-3px}
.subtitle{font-size:1.8rem;font-weight:900;color:#000;margin:.5rem 0}
.strip{background:#e00;color:#fff;font-weight:900;font-size:.8rem;letter-spacing:3px;padding:.5rem;margin:1rem -2rem;text-transform:uppercase}
.desc{font-size:.85rem;color:#333;margin:1rem 0;line-height:1.6}
.desc b{color:#e00}
.herograms{display:flex;gap:.6rem;justify-content:center;margin:1rem 0;flex-wrap:wrap}
.hero-badge{padding:.4rem .8rem;border:2px solid #000;border-radius:0;font-weight:900;font-size:.7rem;background:#ff0;cursor:pointer}
.hero-badge:nth-child(2){background:#0cf}
.hero-badge:nth-child(3){background:#0f0}
.hero-badge:nth-child(4){background:#f90}
.cta{margin-top:1.5rem;padding:1rem 2.5rem;background:#e00;color:#fff;font-weight:900;font-size:1.1rem;border:3px solid #000;letter-spacing:2px;cursor:pointer;transform:rotate(-1deg);box-shadow:4px 4px 0 #000;transition:transform .2s}
.cta:hover{transform:rotate(0) scale(1.05)}
.bottom-text{margin-top:2rem;font-size:.6rem;color:#999;letter-spacing:3px;font-weight:700}
</style>
</head>
<body>
<div class="page">
<div class="dots"></div>
<div class="comic-box">
  <div class="speech">⚡ AI PHOTOS WITH ANYONE</div>
  <div class="pow">跟名人</div>
  <div class="subtitle">合 影 ！</div>
  <div class="strip">▸ GPT-IMAGE 2.0 驱动 ◂</div>
  <div class="desc">
    拍一张自拍 → 选你的爱豆<br>
    <b>3秒出合影，爽翻天！</b>
  </div>
  <div class="herograms">
    <span class="hero-badge">💃 Taylor</span>
    <span class="hero-badge">🚀 Musk</span>
    <span class="hero-badge">⚽ Messi</span>
    <span class="hero-badge">🎤 周杰伦</span>
  </div>
  <button class="cta">📸 开拍！</button>
</div>
<div class="bottom-text">MINGREN.PICS</div>
</div>
</body>
</html>
