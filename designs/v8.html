<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mingren.pics V8 - SpaceX Style</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#000;color:#fff;min-height:100vh;letter-spacing:.02em}
.full-hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:2rem 1.5rem;position:relative;background:radial-gradient(ellipse at 50% 120%,rgba(255,255,255,.03) 0%,transparent 60%)}
.full-hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,255,255,.01) 60px,rgba(255,255,255,.01) 61px),repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(255,255,255,.01) 60px,rgba(255,255,255,.01) 61px);pointer-events:none}
nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.5rem;z-index:100}
nav .logo{font-size:.7rem;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.6)}
nav .menu{font-size:.7rem;font-weight:500;letter-spacing:.2em;color:rgba(255,255,255,.3);text-transform:uppercase}
.hero-content{position:relative;z-index:1}
.hero-content .overline{font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:1.5rem}
.hero-content h1{font-size:3.5rem;font-weight:400;letter-spacing:-.02em;line-height:1;margin-bottom:1.5rem}
.hero-content h1 span{display:block;font-size:1.2rem;letter-spacing:.15em;font-weight:300;color:rgba(255,255,255,.4);margin-top:.5rem;text-transform:uppercase}
.hero-content p{font-size:.85rem;color:rgba(255,255,255,.3);line-height:1.8;max-width:280px;margin-bottom:2rem}
.btn-row{display:flex;gap:1rem;align-items:center}
.btn-outline{padding:.7rem 2rem;border:1px solid rgba(255,255,255,.2);border-radius:0;color:#fff;font-size:.75rem;font-weight:500;letter-spacing:.15em;text-transform:uppercase;background:transparent;cursor:pointer;transition:all .2s}
.btn-outline:hover{background:#fff;color:#000}
.scroll-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);font-size:.6rem;letter-spacing:.2em;color:rgba(255,255,255,.15);text-transform:uppercase;writing-mode:vertical-rl}
.section-dark{padding:4rem 1.5rem;border-top:1px solid rgba(255,255,255,.05)}
.section-dark h2{font-size:1.5rem;font-weight:400;letter-spacing:.05em;margin-bottom:2rem}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.05)}
.grid-3 .cell{background:#000;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;cursor:pointer;transition:background .2s}
.grid-3 .cell:hover{background:rgba(255,255,255,.03)}
.grid-3 .cell .emoji{font-size:2rem}.grid-3 .cell .name{font-size:.6rem;color:rgba(255,255,255,.3);letter-spacing:.1em;text-transform:uppercase}
.upload-strip{padding:3rem 1.5rem;border-top:1px solid rgba(255,255,255,.05);text-align:center}
.upload-strip .box{width:100%;aspect-ratio:16/9;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:rgba(255,255,255,.2);letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:border-color .2s}
.upload-strip .box:hover{border-color:rgba(255,255,255,.2)}
</style>
</head>
<body>
<div class="full-hero">
  <nav>
    <div class="logo">mingren.pics</div>
    <div class="menu">menu</div>
  </nav>
  <div class="hero-content">
    <div class="overline">AI Photo Engine v2.0</div>
    <h1>名人合影<span>Celebrity photo generator</span></h1>
    <p>上传自拍，选择名人，AI生成以假乱真的合影照片。基于最新的GPT-Image 2.0引擎。</p>
    <div class="btn-row">
      <button class="btn-outline">开始生成</button>
      <button class="btn-outline" style="border-color:rgba(255,255,255,.08);color:rgba(255,255,255,.3)">了解更多</button>
    </div>
  </div>
  <div class="scroll-hint">scroll</div>
</div>
<div class="section-dark">
  <h2>选择名人</h2>
  <div class="grid-3">
    <div class="cell"><span class="emoji">💃</span><span class="name">Taylor</span></div>
    <div class="cell"><span class="emoji">🚀</span><span class="name">Musk</span></div>
    <div class="cell"><span class="emoji">⚽</span><span class="name">Messi</span></div>
    <div class="cell"><span class="emoji">🎤</span><span class="name">周杰伦</span></div>
    <div class="cell"><span class="emoji">🎮</span><span class="name">黄仁勋</span></div>
    <div class="cell"><span class="emoji">🌸</span><span class="name">BTS V</span></div>
    <div class="cell"><span class="emoji">🏆</span><span class="name">C罗</span></div>
    <div class="cell"><span class="emoji">💎</span><span class="name">Rihanna</span></div>
    <div class="cell"><span class="emoji">✨</span><span class="name">热巴</span></div>
  </div>
</div>
<div class="upload-strip">
  <div class="box">↑ 上传你的自拍照片</div>
</div>
</body>
</html>
