<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mingren.pics V6 - Spotify Style</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:#121212;color:#fff;min-height:100vh}
.page{min-height:100vh}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.5rem}
.logo{font-weight:800;font-size:1.1rem;color:#1ed760;letter-spacing:-.02em}
.avatar{width:28px;height:28px;border-radius:50%;background:#1ed760;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#121212;font-weight:700}
.hero-section{padding:2.5rem 1.5rem 1.5rem;background:linear-gradient(180deg,rgba(30,215,96,.08) 0%,transparent 100%)}
.hero-section h1{font-size:2.8rem;font-weight:900;letter-spacing:-.03em;line-height:1;margin-bottom:.5rem}
.hero-section h1 .green{color:#1ed760}
.hero-section p{font-size:.9rem;color:rgba(255,255,255,.4);max-width:280px}
.upload-big{margin:1.5rem;padding:2rem;border-radius:20px;background:#1a1a1a;border:2px solid rgba(30,215,96,.1);text-align:center;cursor:pointer;transition:all .2s}
.upload-big:hover{border-color:rgba(30,215,96,.3)}
.upload-big .icon{font-size:2.5rem;margin-bottom:.5rem;display:block}
.upload-big p{font-size:.85rem;color:rgba(255,255,255,.3)}
.upload-big p strong{color:#1ed760}
.section{padding:1.5rem}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.section-head h3{font-size:1rem;font-weight:700}
.section-head span{font-size:.75rem;color:rgba(255,255,255,.3);font-weight:500}
.scroll-row{display:flex;gap:.75rem;overflow-x:auto;padding-bottom:.5rem}
.album-card{min-width:130px;cursor:pointer}
.album-art{width:130px;height:130px;border-radius:12px;background:#282828;display:flex;align-items:center;justify-content:center;font-size:3rem;margin-bottom:.5rem;transition:background .2s}
.album-card:hover .album-art{background:#333}
.album-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-sub{font-size:.7rem;color:rgba(255,255,255,.3)}
.genre-row{display:flex;gap:.5rem;flex-wrap:wrap;padding:0 1.5rem;margin-bottom:1.5rem}
.genre{padding:.5rem 1rem;border-radius:999px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s}
.genre:hover{opacity:.9}
.g1{background:#e13300;color:#fff}.g2{background:#1e3264;color:#fff}.g3{background:#8c1932;color:#fff}
.g4{background:#148a08;color:#fff}.g5{background:#e8115b;color:#fff}.g6{background:#503750;color:#fff}
.big-btn{margin:1.5rem;padding:1rem;border-radius:999px;background:#1ed760;color:#000;font-weight:700;font-size:1rem;border:none;cursor:pointer;width:calc(100% - 3rem);transition:transform .1s}
.big-btn:hover{transform:scale(1.02)}
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <div class="logo">mingren.pics</div>
    <div class="avatar">K</div>
  </div>
  <div class="hero-section">
    <h1>跟你的<br><span class="green">偶像</span>合影</h1>
    <p>上传自拍，3秒生成跟任何名人的合影</p>
  </div>
  <div class="upload-big">
    <span class="icon">📸</span>
    <p><strong>点击上传</strong>你的自拍照片</p>
  </div>
  <div class="genre-row">
    <span class="genre g1">🎤 华语</span>
    <span class="genre g2">🎬 好莱坞</span>
    <span class="genre g3">🌸 韩流</span>
    <span class="genre g4">⚽ 体育</span>
    <span class="genre g5">💎 欧美</span>
    <span class="genre g6">💻 科技</span>
  </div>
  <div class="section">
    <div class="section-head"><h3>热门名人</h3><span>查看全部 →</span></div>
    <div class="scroll-row">
      <div class="album-card"><div class="album-art">💃</div><div class="album-name">Taylor Swift</div><div class="album-sub">歌手</div></div>
      <div class="album-card"><div class="album-art">🚀</div><div class="album-name">Elon Musk</div><div class="album-sub">CEO</div></div>
      <div class="album-card"><div class="album-art">⚽</div><div class="album-name">Messi</div><div class="album-sub">足球</div></div>
      <div class="album-card"><div class="album-art">🎤</div><div class="album-name">周杰伦</div><div class="album-sub">歌手</div></div>
      <div class="album-card"><div class="album-art">🎮</div><div class="album-name">黄仁勋</div><div class="album-sub">NVIDIA</div></div>
    </div>
  </div>
  <button class="big-btn">✨ 开始生成</button>
</div>
</body>
</html>
