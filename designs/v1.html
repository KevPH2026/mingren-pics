<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mingren.pics V1 - Framer Style</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000;--accent:#2563eb;--accent2:#7c3aed;--glow:rgba(37,99,235,.3)}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#fff;min-height:100vh;overflow-x:hidden}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;position:relative}
.hero::before{content:'';position:absolute;top:-20%;left:-20%;width:140%;height:140%;background:radial-gradient(ellipse at 30% 20%,rgba(37,99,235,.15) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(124,58,237,.12) 0%,transparent 50%);animation:drift 8s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-2%,2%) scale(1.05)}}
.badge{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:999px;background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.2);font-size:.75rem;color:#93c5fd;margin-bottom:2rem;backdrop-filter:blur(10px);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.badge .dot{width:6px;height:6px;border-radius:50%;background:#3b82f6;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
h1{font-size:3.5rem;font-weight:900;line-height:1;letter-spacing:-.04em;text-align:center;margin-bottom:1.5rem;position:relative;background:linear-gradient(135deg,#fff 0%,#93c5fd 50%,#c4b5fd 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h1 span{display:block;font-size:1.8rem;font-weight:300;letter-spacing:.1em;-webkit-text-fill-color:rgba(255,255,255,.4);margin-top:.5rem}
.subtitle{text-align:center;color:rgba(255,255,255,.4);font-size:1rem;max-width:320px;line-height:1.6;margin-bottom:3rem}
.cta-btn{position:relative;display:inline-flex;align-items:center;gap:.75rem;padding:1rem 2.5rem;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-weight:700;font-size:1.1rem;border:none;cursor:pointer;box-shadow:0 0 40px var(--glow),0 0 80px rgba(124,58,237,.1);transition:all .3s;text-decoration:none}
.cta-btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 60px var(--glow)}
.celeb-row{display:flex;gap:1rem;margin-top:3rem;overflow:hidden;padding:0 1rem}
.celeb-card{width:80px;height:100px;border-radius:16px;background:linear-gradient(135deg,rgba(37,99,235,.1),rgba(124,58,237,.1));border:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25rem;backdrop-filter:blur(10px);animation:slideIn .6s ease-out both}
.celeb-card:nth-child(1){animation-delay:0s}.celeb-card:nth-child(2){animation-delay:.1s}.celeb-card:nth-child(3){animation-delay:.2s}.celeb-card:nth-child(4){animation-delay:.3s}.celeb-card:nth-child(5){animation-delay:.4s}
@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.celeb-card .emoji{font-size:2rem}.celeb-card .name{font-size:.6rem;color:rgba(255,255,255,.5)}
.scenarios{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-top:2.5rem;width:100%;max-width:360px}
.scenario{padding:1rem;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);text-align:center;font-size:.8rem;color:rgba(255,255,255,.5);transition:all .3s}
.scenario:hover{background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.2);color:#93c5fd}
.scenario .icon{font-size:1.5rem;display:block;margin-bottom:.4rem}
.watermark{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);font-size:.7rem;color:rgba(255,255,255,.15);letter-spacing:.2em;text-transform:uppercase}
</style>
</head>
<body>
<div class="hero">
  <div class="badge"><span class="dot"></span>Powered by GPT-Image 2.0</div>
  <h1>跟名人<br>合影<span>AI PHOTOS WITH ANYONE</span></h1>
  <p class="subtitle">上传自拍，选个名人，3秒出合影。比真的还真。</p>
  <a href="#" class="cta-btn">📸 开始生成 →</a>
  <div class="celeb-row">
    <div class="celeb-card"><span class="emoji">💃</span><span class="name">Taylor</span></div>
    <div class="celeb-card"><span class="emoji">🚀</span><span class="name">Musk</span></div>
    <div class="celeb-card"><span class="emoji">⚽</span><span class="name">Messi</span></div>
    <div class="celeb-card"><span class="emoji">🎤</span><span class="name">周杰伦</span></div>
    <div class="celeb-card"><span class="emoji">🌸</span><span class="name">BTS V</span></div>
  </div>
  <div class="scenarios">
    <div class="scenario"><span class="icon">🏆</span>走红毯</div>
    <div class="scenario"><span class="icon">🤳</span>自拍合影</div>
    <div class="scenario"><span class="icon">☕</span>喝咖啡</div>
    <div class="scenario"><span class="icon">✈️</span>旅行打卡</div>
  </div>
</div>
<div class="watermark">mingren.pics</div>
</body>
</html>
